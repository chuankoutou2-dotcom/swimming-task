name: 機能リクエスト
 description: 新機能や改善を提案する
 title: "[提案] "
 labels: [enhancement]
 body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どのような課題や不便を解決したいか記載してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する内容
      description: 実現したい機能や改善を記載してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した他の方法があれば記載してください。
    validations:
      required: false
